<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudo Biológicas – 1º ano EM</title>
<style>
:root{--bg:#f3f6f1;--card:#fff;--tx:#1d2a24;--mut:#5d6b64;--bd:#d5ddd6;--bio:#2f7d4f;--fis:#2d5fa8;--qui:#a8512d;--esp:#7a3fa0;--ok:#1f7a3f;--okbg:#e0f3e6;--no:#b3261e;--nobg:#fbe5e3}
@media(prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1d2621;--tx:#e8eee9;--mut:#9aa8a0;--bd:#33403a;--bio:#5fbf85;--fis:#7aa7ec;--qui:#e59a74;--esp:#c39be0;--ok:#6fd392;--okbg:#17321f;--no:#ff8a80;--nobg:#3a1c1a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 Georgia,"Times New Roman",serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.7rem;margin:.4em 0 .2em}
p.sub{color:var(--mut);margin:0 0 18px;font-family:system-ui,sans-serif;font-size:.95rem}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-family:system-ui,sans-serif}
nav button,.btn{font:600 .95rem system-ui,sans-serif;border:2px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:8px;cursor:pointer}
nav button[aria-pressed=true]{color:#fff;border-color:transparent;background:var(--c)}
nav button:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--c,var(--fis));outline-offset:2px}
.tabs{display:flex;gap:0;margin-bottom:16px;font-family:system-ui,sans-serif}
.tabs button{flex:1;padding:10px;border:0;border-bottom:3px solid var(--bd);background:none;color:var(--mut);font:600 1rem system-ui,sans-serif;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--c);border-color:var(--c)}
.box{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--c);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.box h3{margin:0 0 6px;font-size:1.08rem}
.box ul{margin:0;padding-left:20px}
.box li{margin:3px 0}
.tip{background:var(--okbg);border-radius:8px;padding:10px 14px;font-family:system-ui,sans-serif;font-size:.93rem}
table{width:100%;border-collapse:collapse;font-family:system-ui,sans-serif;font-size:.92rem}
td,th{border:1px solid var(--bd);padding:6px 8px;text-align:left}
.bar{height:8px;background:var(--bd);border-radius:4px;margin:6px 0 16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;font:.9rem system-ui,sans-serif;color:var(--mut)}
.q{font-size:1.15rem;margin:8px 0 14px}
.opt{display:block;width:100%;text-align:left;font:1rem/1.4 Georgia,serif;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:8px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--nobg);border-color:var(--no)}
.opt:disabled{cursor:default}
.exp{margin:12px 0;padding:12px 14px;border-radius:8px;background:var(--card);border:1px solid var(--bd);font-size:.97rem}
.btn{background:var(--c);color:#fff;border-color:transparent}
.big{font-size:2.4rem;font-weight:bold;margin:4px 0;color:var(--c)}
[hidden]{display:none!important}
.fm{background:var(--c);color:#fff;border-radius:10px;padding:14px 10px;text-align:center;font:700 1.9rem/1.3 Georgia,serif;margin:12px 0 6px;letter-spacing:.5px}
.fm small{display:block;font:500 .88rem system-ui,sans-serif;opacity:.92;margin-top:4px;letter-spacing:0}
@media(prefers-color-scheme:dark){.fm,.btn,nav button[aria-pressed=true]{color:#0f1a14}}
.svgw{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;margin:10px 0}
.svgw svg{width:100%;height:auto;display:block}
.svgw text{fill:var(--tx);font:13px system-ui,sans-serif}
.cap{font:.88rem system-ui,sans-serif;color:var(--mut);margin:4px 2px 0}
h2.sec{font-size:1.18rem;margin:26px 0 8px;border-bottom:3px solid var(--c);padding-bottom:4px}
.ex{background:var(--okbg);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:.95rem}
.warn{background:var(--nobg);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:.95rem}
.ex b:first-child,.warn b:first-child{font-family:system-ui,sans-serif}
ol.st{padding-left:22px;margin:6px 0}
</style>
</head>
<body>
<main>
<h1>Avaliação bimestral de Biológicas</h1>
<p class="sub">1º ano EM · Biologia, Física e Química. Escolha a matéria, leia o resumo e teste no quiz.</p>
<nav id="subj" aria-label="Matéria"></nav>
<div class="tabs" role="tablist">
  <button role="tab" id="t1" aria-selected="true">Resumo</button>
  <button role="tab" id="t2" aria-selected="false">Quiz</button>
</div>
<section id="resumo"></section>
<section id="quiz" hidden></section>
</main>

<script>
const S={
bio:{n:"Biologia",c:"var(--bio)",r:[
["Caminho da água","Raiz absorve → xilema sobe → folha transpira pelos estômatos."],
["Transpiração","Perda de água por estômatos e cutícula. Aumenta com luz, calor, vento e água no solo. Diminui com ar úmido e pouca água disponível."],
["Estômatos","Duas células-guarda formam o ostíolo. Entram íons → entra água por osmose → células túrgidas → abre. Células flácidas → fecha. Dilema: abrir capta CO₂, mas perde água."],
["Raiz","Zona pilífera tem pelos absorventes. Água vai pela via apoplástica (paredes) ou simplástica (dentro das células, ligadas por plasmodesmos). As estrias de Caspary, na endoderme, bloqueiam a via apoplástica e tornam a absorção seletiva."],
["Xilema e floema","Xilema: seiva bruta (água e sais), com elementos de vaso e traqueídes. Floema: seiva elaborada (açúcares), com tubos crivados e células companheiras."],
["Subida da seiva","Coesão-tensão: a evaporação puxa a coluna de água (mecanismo principal). Pressão da raiz empurra de baixo. Gutação: gotas de água líquida nas folhas."],
["Falta de água","Caducifólias perdem folhas na seca. Seca fisiológica: há água no solo, mas indisponível (solo salgado ou frio). Xerófitas: espinhos, caule clorofilado, menos área de perda."]]},
fis:{n:"Física",c:"var(--fis)",r:[
["Energia elétrica","E = P·Δt. Converta W → kW (÷1000) e min → h (÷60). kWh é a unidade da conta de luz. Some os aparelhos, multiplique pelos dias e pela tarifa."],
["Energia cinética","Ec = m·v²/2. km/h → m/s: divida por 3,6. Dobrar a velocidade = 4× a Ec. Triplicar = 9×."],
["Potência média","P = ΔE/Δt. O trabalho é igual à variação da energia cinética."],
["Energia potencial","Epg = m·g·h. Você escolhe o nível de referência (onde Epg = 0)."],
["Conservação","Sem atrito, Ec + Epg é constante. Subindo, Ec vira Epg. Descendo, Epg vira Ec. Em um gráfico de barras, a soma das barras é sempre igual."]]},
qui:{n:"Química",c:"var(--qui)",r:[
["Concentração comum","C = m/V em g/L. Converta mL → L (÷1000). Isolando: m = C·V."],
["Concentração × densidade","Concentração: massa do soluto ÷ volume da solução. Densidade: massa da solução inteira ÷ seu volume."],
["Mol/L","M = n/V, n = m/MM e C = M·MM. A massa molar vem da soma das massas atômicas da tabela periódica."],
["Solubilidade","Coeficiente de solubilidade é o máximo que dissolve em certa quantidade de água. 'Insolúvel' = dissolve muito pouco."],
["Funções inorgânicas","Ácido: H ionizável (H₂SO₄, HCl). Base: OH⁻ (KOH, Al(OH)₃, Mg(OH)₂ nos antiácidos). Sal: vem da neutralização (NaCl). Óxido: binário com oxigênio (SO₂, CO₂, CaO)."]]},
esp:{n:"Química Especial",c:"var(--esp)",r:[
["Óxido","Composto binário com oxigênio, em que o O é o elemento mais eletronegativo. Fórmula geral: ExOy."],
["Molecular (ametal + O)","Nome com prefixos: mono, di, tri, tetra, penta... Ex.: CO₂ = dióxido de carbono; P₂O₅ = pentóxido de difósforo. Sem 'mono' no 2º elemento."],
["Iônico (metal + O)","Nome: óxido de + elemento. Se houver mais de uma carga possível, use romano: Fe₂O₃ = óxido de ferro III."],
["Peróxido","Tem o grupo O₂²⁻. Aparece com grupos 1, 2 e H. Nome: peróxido de + elemento. H₂O₂, Na₂O₂, CaO₂."],
["Indicadores","Repolho roxo: vermelho → rosa → roxo → azul → verde → amarelo (do mais ácido ao mais básico). Fenolftaleína: incolor em ácido; rosa/violeta/vermelho em base."]]}
};
const Q=[
["bio","Em um dia quente, com o solo muito seco, uma planta tende a:",["abrir os estômatos para aumentar a absorção de água pelas folhas.","fechar os estômatos, reduzindo a transpiração e também a entrada de CO₂.","manter os estômatos abertos, pois a transpiração resfria a raiz.","transportar seiva elaborada pelo xilema para compensar a perda de água.","abrir os estômatos porque as células-guarda ficam flácidas."],1,"Sem água, as células-guarda perdem íons e água, ficam flácidas e o estômato fecha. A transpiração cai, mas a entrada de CO₂ (e a fotossíntese) também."],
["bio","As estrias de Caspary, na endoderme da raiz, têm como função:",["armazenar amido para o crescimento radicular.","bloquear a via apoplástica, obrigando água e sais a atravessar membranas, o que torna a absorção seletiva.","conduzir seiva elaborada até as raízes.","produzir pelos absorventes.","impedir a entrada de qualquer água no cilindro central."],1,"A estria interrompe o caminho pelas paredes. A passagem obrigatória pelas membranas permite selecionar o que entra."],
["bio","Cactos têm folhas transformadas em espinhos e caule clorofilado. A principal vantagem é:",["aumentar a superfície de transpiração.","reduzir a superfície de perda de água, enquanto o caule assume a fotossíntese.","eliminar a necessidade de estômatos.","permitir a absorção de água pelos espinhos.","acelerar a condução de seiva bruta pelo floema."],1,"Espinhos reduzem a área de transpiração, e o caule clorofilado faz a fotossíntese."],
["bio","A gutação é:",["a perda de folhas na estação seca.","a saída de vapor de água pelos estômatos.","a saída de água líquida pelas folhas, empurrada pela pressão positiva da raiz.","o transporte de açúcar pelo floema.","o fechamento dos estômatos à noite."],2,"Gutação são gotas de água líquida que saem pelas folhas, geralmente de manhã, por causa da pressão da raiz."],
["bio","O xilema transporta principalmente:",["seiva elaborada, por tubos crivados.","seiva bruta (água e sais), por elementos de vaso e traqueídes.","seiva elaborada, por traqueídes.","seiva bruta, por células companheiras.","apenas gases, do solo até as folhas."],1,"Xilema = seiva bruta (água e sais). Floema = seiva elaborada, com tubos crivados e células companheiras."],
["fis","Uma casa usa por dia: chuveiro de 4.800 W por 15 min, TV de 150 W por 4 h e micro-ondas de 1.200 W por 30 min. Com 30 dias e tarifa de R$ 0,80/kWh, consumo e custo mensais são:",["24 kWh e R$ 19,20","48 kWh e R$ 38,40","72 kWh e R$ 57,60","96 kWh e R$ 76,80","144 kWh e R$ 115,20"],2,"Chuveiro 4,8 × 0,25 = 1,2 kWh. TV 0,15 × 4 = 0,6 kWh. Micro-ondas 1,2 × 0,5 = 0,6 kWh. Total 2,4 kWh/dia × 30 = 72 kWh. 72 × 0,80 = R$ 57,60."],
["fis","Uma moto com piloto (200 kg) passa de 54 km/h para 108 km/h em 5 s. A potência média é:",["4.500 W","6.750 W","13.500 W","18.000 W","22.500 W"],2,"54 km/h = 15 m/s e 108 km/h = 30 m/s. Ec inicial = 22.500 J; final = 90.000 J; ΔEc = 67.500 J. P = 67.500 ÷ 5 = 13.500 W."],
["fis","Um carrinho de 500 kg parte do repouso a 20 m de altura (g = 10 m/s², sem atrito, Epg = 0 no solo). Ao passar por 5 m de altura, a divisão da energia mecânica é:",["100% Epg","75% Epg e 25% Ec","50% Epg e 50% Ec","25% Epg e 75% Ec","100% Ec"],3,"Total = 500 × 10 × 20 = 100.000 J. A 5 m, Epg = 25.000 J (25%). Os 75% restantes são energia cinética."],
["fis","Se a velocidade de um carro triplica, sua energia cinética:",["triplica.","fica 6 vezes maior.","fica 9 vezes maior.","fica 4 vezes maior.","não muda."],2,"Ec depende de v². Triplicar a velocidade multiplica a energia por 3² = 9."],
["fis","Um aparelho de 2.000 W fica ligado 3 h. A energia consumida é:",["0,6 kWh","6 kWh","60 kWh","2 kWh","600 kWh"],1,"2.000 W = 2 kW. E = 2 × 3 = 6 kWh."],
["qui","Dissolvem-se 30 g de sacarose em água até completar 250 mL de solução. A concentração comum é:",["7,5 g/L","8,3 g/L","12 g/L","120 g/L","1.200 g/L"],3,"250 mL = 0,25 L. C = 30 ÷ 0,25 = 120 g/L."],
["qui","Solução de KOH com 28 g/L (K = 39; O = 16; H = 1). A concentração em mol/L e a massa de KOH em 200 mL são:",["0,5 mol/L e 5,6 g","0,5 mol/L e 56 g","2,0 mol/L e 5,6 g","1,0 mol/L e 28 g","0,28 mol/L e 140 g"],0,"MM = 39 + 16 + 1 = 56 g/mol. M = 28 ÷ 56 = 0,5 mol/L. Em 0,2 L: m = 28 × 0,2 = 5,6 g."],
["qui","Considere: I. H₂SO₄ é ácido usado em baterias. II. KOH é um sal. III. SO₂ é óxido liberado na queima de combustíveis com enxofre. IV. Al(OH)₃ é base. Estão corretas:",["I e II","II e IV","I e III","I, III e IV","todas"],3,"KOH tem OH⁻, então é base, não sal. As afirmações I, III e IV estão corretas."],
["qui","Foram dissolvidos 4 g de NaOH em 500 mL de solução. A concentração comum é:",["2 g/L","4 g/L","8 g/L","16 g/L","0,8 g/L"],2,"500 mL = 0,5 L. C = 4 ÷ 0,5 = 8 g/L."],
["qui","O Mg(OH)₂, presente em antiácidos, pertence à função:",["ácido","base","sal","óxido","hidrocarboneto"],1,"Tem o grupo OH⁻, então é uma base. Ela neutraliza o excesso de ácido no estômago."],
["esp","Qual das substâncias abaixo é um óxido?",["NaCl","H₂O","HCl","KOH","NaOH"],1,"Óxido é composto binário com oxigênio como elemento mais eletronegativo. H₂O tem só 2 elementos, H e O. NaCl e HCl não têm O; KOH e NaOH têm 3 elementos (são bases)."],
["esp","O nome do P₂O₅ é:",["pentóxido de difósforo","óxido de fósforo V","pentóxido de fósforo","dióxido de pentafósforo","óxido de difósforo"],0,"5 oxigênios dão 'pentóxido'. 2 fósforos dão 'difósforo'. É molecular (ametal + O), então usa prefixos nos dois."],
["esp","O nome correto do CO₂ é:",["monóxido de carbono","dióxido de monocarbono","dióxido de carbono","óxido de carbono","trióxido de carbono"],2,"2 oxigênios = dióxido. Como há só 1 carbono, não se coloca 'mono' no segundo elemento."],
["esp","Fe₂O₃ é um óxido iônico formado por Fe³⁺ e O²⁻. Seu nome é:",["óxido de ferro II","óxido de ferro III","dióxido de ferro","peróxido de ferro","monóxido de diferro"],1,"Óxido iônico: 'óxido de + elemento'. O ferro tem mais de uma carga possível, então se indica a carga em romano: Fe³⁺ = ferro III."],
["esp","Qual fórmula representa um peróxido?",["Na₂O","CO₂","H₂O₂","CaO","SO₃"],2,"Peróxido tem o grupo O₂²⁻. H₂O₂ é o peróxido de hidrogênio (molecular). Na₂O e CaO são óxidos iônicos; CO₂ e SO₃ são moleculares."],
["esp","Qual par fórmula/classificação está correto?",["SO₃ – óxido iônico","Na₂O – óxido molecular","CaO – óxido iônico","CO – peróxido","Na₂O₂ – óxido molecular"],2,"CaO = metal + oxigênio, logo iônico. SO₃ e CO são moleculares (ametal + O). Na₂O é iônico. Na₂O₂ é peróxido."],
["esp","O nome de Na₂O₂ é:",["óxido de sódio","dióxido de sódio","peróxido de sódio","dióxido de dissódio","óxido de sódio II"],2,"Na₂O₂ tem o grupo O₂²⁻ ligado ao sódio (grupo 1): peróxido de sódio."],
["esp","Pelo roteiro, o suco de repolho roxo em uma solução de pH 12 fica:",["vermelho","rosa","roxo","verde","amarelo"],3,"A faixa de pH 11 a 13 corresponde à cor verde. Sequência: vermelho, rosa, roxo, azul, verde, amarelo."],
["esp","Em meio ácido, a fenolftaleína fica:",["rosa","vermelha","violeta","incolor","azul"],3,"Fenolftaleína é incolor em meio ácido. Em meio básico, vai de rosa a violeta ou vermelho."],
["esp","O nome do Cl₂O é:",["monóxido de dicloro","óxido de cloro","dióxido de cloro","monóxido de cloro","óxido de dicloro"],0,"1 oxigênio dá 'monóxido'. 2 cloros dão 'dicloro'. Como é molecular (ametal + O), usa prefixos nos dois."],
["bio","Quando as células-guarda ficam túrgidas, o estômato:",["fecha, porque a água sai das células.","abre, porque as células se curvam e ampliam o ostíolo.","continua igual, pois o turgor não interfere.","fecha, porque entra CO₂ demais.","abre, porque as células ficam flácidas."],1,"Células cheias de água (túrgidas) se curvam e abrem o ostíolo. Flácidas, o estômato fecha."],
["bio","Qual condição tende a DIMINUIR a transpiração?",["vento forte","ar com muita umidade","alta luminosidade","temperatura elevada","ar muito seco"],1,"Com o ar já úmido, a água evapora menos da folha. Luz, calor, vento e ar seco aumentam a transpiração."],
["bio","Os plasmodesmos são:",["poros da cutícula por onde sai vapor.","as células que formam o xilema.","conexões entre o citoplasma de células vizinhas, usadas na via simplástica.","faixas de suberina da endoderme.","gotas de água eliminadas pelas folhas."],2,"Plasmodesmos são 'pontes' citoplasmáticas entre células vizinhas. É por elas que a água segue pela via simplástica."],
["bio","A seca fisiológica ocorre quando:",["há água no solo, mas a planta não consegue absorvê-la.","a planta perde todas as folhas.","o solo está completamente seco.","os estômatos ficam sempre abertos.","a planta faz mais fotossíntese."],0,"É 'água presente, porém indisponível', como em solo muito salgado ou muito frio."],
["bio","Na teoria da coesão-tensão, a força que puxa a coluna de água é gerada principalmente por:",["pressão da raiz","evaporação (transpiração) nas folhas","bombeamento pelo floema","gutação","fotossíntese no caule"],1,"A água que evapora na folha puxa a coluna, e a coesão entre as moléculas mantém a 'corrente' unida."],
["fis","Qual é a energia cinética de um corpo de 2 kg a 3 m/s?",["3 J","6 J","9 J","18 J","27 J"],2,"Ec = m·v²/2 = 2 × 3² ÷ 2 = 2 × 9 ÷ 2 = 9 J."],
["fis","72 km/h correspondem, em m/s, a:",["20","25","72","259","2"],0,"Divida por 3,6: 72 ÷ 3,6 = 20 m/s."],
["fis","Qual é a Epg de um corpo de 2 kg a 5 m do chão (g = 10 m/s², Epg = 0 no chão)?",["10 J","50 J","100 J","200 J","1.000 J"],2,"Epg = m·g·h = 2 × 10 × 5 = 100 J."],
["fis","Em uma descida sem atrito, o que acontece com a energia?",["Ec e Epg aumentam juntas.","A Epg se transforma em Ec, e a soma permanece constante.","A Ec se transforma em Epg.","A energia total diminui.","A Epg aumenta e a Ec fica constante."],1,"Descendo, a altura diminui (Epg cai) e a velocidade aumenta (Ec sobe). Sem atrito, Ec + Epg não muda."],
["fis","Um ferro de 1.000 W fica ligado 2 h por dia, por 30 dias. Com tarifa de R$ 0,60/kWh, o custo mensal é:",["R$ 12,00","R$ 18,00","R$ 36,00","R$ 60,00","R$ 72,00"],2,"1.000 W = 1 kW. 1 × 2 = 2 kWh/dia. × 30 = 60 kWh. 60 × 0,60 = R$ 36,00."],
["qui","Qual massa de soluto há em 2 L de uma solução de 15 g/L?",["7,5 g","15 g","30 g","60 g","0,13 g"],2,"m = C × V = 15 × 2 = 30 g."],
["qui","A massa molar do H₂SO₄ (H = 1; S = 32; O = 16) é:",["49 g/mol","82 g/mol","114 g/mol","98 g/mol","196 g/mol"],3,"2 × 1 + 32 + 4 × 16 = 2 + 32 + 64 = 98 g/mol."],
["qui","Foram dissolvidos 40 g de NaOH (MM = 40 g/mol) em 2 L de solução. A concentração em mol/L é:",["0,5 mol/L","1 mol/L","2 mol/L","20 mol/L","80 mol/L"],0,"n = 40 ÷ 40 = 1 mol. M = n ÷ V = 1 ÷ 2 = 0,5 mol/L."],
["qui","Qual afirmação sobre concentração e densidade está correta?",["São a mesma grandeza.","Concentração usa a massa do soluto; densidade usa a massa da solução inteira.","Densidade usa só a massa do soluto.","Concentração usa a massa da solução inteira.","As duas sempre têm o mesmo valor."],1,"Concentração = massa do soluto ÷ volume da solução. Densidade = massa da solução ÷ volume da solução."],
["qui","O CaO, usado na construção civil como cal virgem, pertence à função:",["ácido","base","sal","óxido","hidreto"],3,"CaO é composto binário com oxigênio, ou seja, um óxido (iônico)."]
];
const $=id=>document.getElementById(id);
let cur="bio",tab=1,qs=[],i=0,score=0,done=false;
function setColor(){document.documentElement.style.setProperty("--c",S[cur].c)}
function nav(){
  $("subj").innerHTML="";
  for(const k in S){const b=document.createElement("button");b.textContent=S[k].n;b.style.setProperty("--c",S[k].c);
    b.setAttribute("aria-pressed",k===cur);b.onclick=()=>{cur=k;start();render()};$("subj").append(b)}
}
const DEFS=`<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b82c4"/></marker><marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e08a1e"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f9e5b"/></marker></defs></svg>`;

bio:`
<h2 class="sec">1. A ideia geral: a planta é um encanamento</h2>
<div class="svgw"><svg viewBox="0 0 420 270" role="img" aria-label="Água sobe pelo xilema e açúcar desce pelo floema">
<rect x="0" y="170" width="420" height="100" fill="#8d6e4f" opacity=".25"/>
<rect x="200" y="50" width="14" height="150" rx="4" fill="#5aa469"/>
<path d="M207 200 L160 245 M207 200 L207 258 M207 200 L255 245" stroke="#a07850" stroke-width="4" fill="none"/>
<ellipse cx="270" cy="75" rx="45" ry="20" fill="#5aa469" transform="rotate(-20 270 75)"/>
<ellipse cx="145" cy="95" rx="45" ry="20" fill="#5aa469" transform="rotate(20 145 95)"/>
<line x1="190" y1="190" x2="190" y2="70" stroke="#3b82c4" stroke-width="4" marker-end="url(#mb)"/>
<line x1="225" y1="70" x2="225" y2="190" stroke="#e08a1e" stroke-width="4" marker-end="url(#mo)"/>
<path d="M300 55 q20 -15 40 -25" stroke="#3b82c4" stroke-width="3" stroke-dasharray="5 4" fill="none" marker-end="url(#mb)"/>
<text x="285" y="20">vapor sai (estômatos)</text>
<text x="55" y="140">Xilema ↑</text><text x="40" y="157">água + sais sobem</text>
<text x="238" y="140">Floema ↓</text><text x="238" y="157">açúcar desce</text>
<text x="262" y="235">Raiz absorve água</text>
</svg></div>
<p>Água entra pela <b>raiz</b>, sobe pelo <b>xilema</b> e sai pela folha como vapor. Na folha acontece a fotossíntese, e o açúcar produzido é distribuído pelo <b>floema</b>.</p>
<table><tr><th></th><th>Leva</th><th>Direção</th><th>Células</th></tr>
<tr><td><b>Xilema</b></td><td>seiva bruta (água + sais)</td><td>sobe</td><td>elementos de vaso e traqueídes</td></tr>
<tr><td><b>Floema</b></td><td>seiva elaborada (açúcar)</td><td>distribui</td><td>tubos crivados e células companheiras</td></tr></table>
<div class="tip" style="margin-top:8px"><b>Dica:</b> o <b>F</b>loema leva o que a <b>F</b>olha <b>F</b>abricou.</div>
<h2 class="sec">2. Transpiração: pense na roupa no varal</h2>
<p>Transpiração é a perda de água em forma de vapor, principalmente pelos <b>estômatos</b> e um pouco pela <b>cutícula</b>. A roupa seca mais rápido quando tem sol, calor, vento e ar seco. Com a planta é igual.</p>
<table><tr><th>Aumenta</th><th>Diminui</th></tr>
<tr><td>Muita luz</td><td>Pouca luz</td></tr><tr><td>Temperatura alta</td><td>Frio</td></tr>
<tr><td>Ar seco</td><td>Ar úmido</td></tr><tr><td>Vento</td><td>Sem vento</td></tr>
<tr><td>Solo com água disponível</td><td>Solo seco (a planta fecha os estômatos)</td></tr></table>
<h2 class="sec">3. Estômatos: a portinha da folha</h2>
<div class="svgw"><svg viewBox="0 0 420 150" role="img" aria-label="Estômato aberto e fechado">
<ellipse cx="80" cy="60" rx="24" ry="42" fill="#5aa469"/><ellipse cx="150" cy="60" rx="24" ry="42" fill="#5aa469"/>
<text x="115" y="58" text-anchor="middle">CO₂ ↓</text><text x="115" y="74" text-anchor="middle">H₂O ↑</text>
<text x="115" y="124" text-anchor="middle" style="font-weight:700">ABERTO</text><text x="115" y="141" text-anchor="middle">células cheias (túrgidas)</text>
<ellipse cx="305" cy="60" rx="24" ry="42" fill="#5aa469"/><ellipse cx="345" cy="60" rx="24" ry="42" fill="#5aa469"/>
<text x="325" y="124" text-anchor="middle" style="font-weight:700">FECHADO</text><text x="325" y="141" text-anchor="middle">células murchas (flácidas)</text>
</svg></div>
<p class="cap">O espaço no meio é o <b>ostíolo</b>. As duas células ao redor são as <b>células-guarda</b>.</p>
<div class="box"><h3>Como ele abre? (é uma sequência)</h3><ol class="st"><li>Íons entram nas células-guarda por <b>transporte ativo</b> (gasta energia).</li><li>Dentro da célula fica mais concentrado.</li><li>A água entra por <b>osmose</b> (vai para onde está mais concentrado).</li><li>A célula incha (<b>túrgida</b>), se curva e o ostíolo <b>abre</b>.</li></ol>Para fechar, o processo se inverte: íons saem, água sai, a célula fica <b>flácida</b>.</div>
<div class="warn"><b>O dilema:</b> abrir o estômato deixa entrar CO₂ (necessário para a fotossíntese), mas também deixa a água escapar. Com calor e solo seco, a planta fecha e perde a fotossíntese para não murchar.</div>
<h2 class="sec">4. Raiz: por onde a água entra</h2>
<p>A água é absorvida na <b>zona pilífera</b>, pelos <b>pelos absorventes</b> (eles aumentam a superfície de contato). Depois ela tem dois caminhos até o centro da raiz:</p>
<div class="svgw"><svg viewBox="0 0 420 190" role="img" aria-label="Vias apoplástica e simplástica na raiz">
<rect x="30" y="35" width="80" height="110" fill="none" stroke="#888" stroke-width="2"/><rect x="110" y="35" width="80" height="110" fill="none" stroke="#888" stroke-width="2"/>
<rect x="190" y="35" width="80" height="110" fill="#e08a1e" fill-opacity=".25" stroke="#888" stroke-width="2"/><rect x="270" y="35" width="80" height="110" fill="none" stroke="#888" stroke-width="2"/>
<text x="70" y="92" text-anchor="middle" style="font-size:11px">córtex</text><text x="150" y="92" text-anchor="middle" style="font-size:11px">córtex</text>
<text x="230" y="92" text-anchor="middle" style="font-size:11px">endoderme</text><text x="310" y="92" text-anchor="middle" style="font-size:11px">cilindro central</text>
<line x1="5" y1="55" x2="184" y2="55" stroke="#3b82c4" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#mb)"/>
<rect x="188" y="35" width="7" height="50" fill="#c0392b"/><text x="200" y="26" style="fill:#c0392b;font-weight:700">Estria de Caspary: bloqueia!</text>
<line x1="5" y1="120" x2="345" y2="120" stroke="#2f9e5b" stroke-width="3" marker-end="url(#mg)"/>
<text x="5" y="167" style="fill:#3b82c4">Apoplástica: entre as células, pelas paredes</text>
<text x="5" y="184" style="fill:#2f9e5b">Simplástica: por dentro das células</text>
</svg></div>
<p><b>Plasmodesmos</b> são pontes minúsculas entre células vizinhas; é por elas que a via simplástica atravessa de uma célula para a outra. Na <b>endoderme</b>, as <b>estrias de Caspary</b> (faixas de suberina) fecham o caminho pelas paredes. Todo mundo é obrigado a entrar <b>pelo interior da célula</b>, atravessando a membrana, que escolhe o que passa. Por isso a absorção é <b>seletiva</b>.</p>
<h2 class="sec">5. Como a água sobe uma árvore de 30 metros?</h2>
<div class="box"><h3>Coesão-tensão (o mecanismo principal)</h3>Imagine tomar suco de canudo. A água evapora na folha e <b>puxa</b> a água de baixo (tensão). Ela não se rompe porque as moléculas <b>grudam umas nas outras</b> (coesão), como uma corrente. A evaporação na folha é o "sugador".</div>
<div class="box"><h3>Pressão positiva da raiz</h3>A raiz <b>empurra</b> a água de baixo para cima. Ajuda, mas é fraca; sozinha não levaria a água até o topo.</div>
<div class="box"><h3>Gutação</h3>Quando a raiz empurra e o ar está muito úmido (a água não evapora), ela sai em <b>gotas líquidas</b> na borda das folhas, geralmente de manhã. Não é orvalho: vem de dentro da planta.</div>
<h2 class="sec">6. Faltou água: como as plantas se viram</h2>
<table><tr><th>Tipo</th><th>O que acontece</th></tr>
<tr><td><b>Caducifólias</b></td><td>Perdem as folhas na época seca. Sem folha, quase não há transpiração.</td></tr>
<tr><td><b>Seca fisiológica</b></td><td>Tem água no solo, mas a planta não consegue pegá-la (solo muito salgado ou muito frio).</td></tr>
<tr><td><b>Xerófitas</b> (cacto)</td><td>Folhas viram espinhos (menos área para perder água), caule clorofilado faz a fotossíntese, caule guarda água.</td></tr></table>`,
fis:`
<h2 class="sec">1. Energia elétrica: a conta de luz</h2>
<div class="fm">E = P × Δt<small>Energia = Potência × Tempo</small></div>
<p><b>Potência</b> é a rapidez com que o aparelho gasta energia. Analogia: se a torneira joga 10 litros por minuto, em 5 minutos saem 50 litros. Aqui, o aparelho "joga" watts, e a energia total é watts vezes o tempo ligado.</p>
<div class="box"><h3>O que é kWh?</h3>1 kWh é a energia gasta por um aparelho de <b>1.000 W ligado durante 1 hora</b>. É a unidade que a companhia de luz cobra.</div>
<div class="box"><h3>Receita para qualquer questão</h3><ol class="st"><li>Watts → kW: <b>÷ 1.000</b></li><li>Minutos → horas: <b>÷ 60</b></li><li>Energia de cada aparelho: <b>kW × h</b></li><li>Some os aparelhos (dia) e multiplique pelos dias (mês).</li><li>Custo = <b>kWh × tarifa</b></li></ol></div>
<div class="ex"><b>Exemplo:</b> chuveiro de 4.800 W por 15 min. 4.800 W = 4,8 kW; 15 min = 0,25 h. E = 4,8 × 0,25 = <b>1,2 kWh</b>.</div>
<h2 class="sec">2. Energia cinética: a energia do movimento</h2>
<div class="fm">Ec = m · v² ÷ 2<small>m em kg, v em m/s, resultado em joules (J)</small></div>
<p>Mais massa e mais velocidade significam mais energia. Mas a velocidade pesa <b>ao quadrado</b>: ela é a que mais manda.</p>
<div class="svgw"><svg viewBox="0 0 420 150" role="img" aria-label="Dobrar a velocidade quadruplica a energia cinética">
<rect x="60" y="90" width="20" height="20" fill="#2d5fa8"/><rect x="170" y="70" width="40" height="40" fill="#2d5fa8"/><rect x="290" y="50" width="60" height="60" fill="#2d5fa8"/>
<text x="70" y="128" text-anchor="middle" style="font-weight:700">v</text><text x="70" y="145" text-anchor="middle">Ec = 1×</text>
<text x="190" y="128" text-anchor="middle" style="font-weight:700">2v</text><text x="190" y="145" text-anchor="middle">Ec = 4×</text>
<text x="320" y="128" text-anchor="middle" style="font-weight:700">3v</text><text x="320" y="145" text-anchor="middle">Ec = 9×</text>
</svg></div>
<p class="cap">A área do quadrado mostra a energia. Lado 2 vezes maior = área 4 vezes maior. Por isso batida a 100 km/h é muito pior que a 50 km/h.</p>
<div class="box"><h3>Converter km/h em m/s</h3>Divida por <b>3,6</b>. Exemplos: 36 km/h = 10 m/s; 54 km/h = 15 m/s; 108 km/h = 30 m/s.</div>
<div class="ex"><b>Exemplo:</b> moto de 200 kg a 54 km/h. v = 54 ÷ 3,6 = 15 m/s. Ec = 200 × 15² ÷ 2 = 200 × 225 ÷ 2 = <b>22.500 J</b>.</div>
<h2 class="sec">3. Potência média</h2>
<div class="fm">P = ΔE ÷ Δt<small>energia transformada ÷ tempo (resultado em watts)</small></div>
<p>Dois carros chegam a 100 km/h, mas um leva 5 s e o outro 10 s. Os dois ganham a mesma energia, mas o primeiro tem potência maior porque fez isso mais rápido. E a variação da energia cinética é igual ao <b>trabalho</b> realizado: <b>W = ΔEc</b>.</p>
<div class="ex"><b>Exemplo:</b> a moto vai de 22.500 J para 90.000 J em 5 s. ΔEc = 67.500 J. P = 67.500 ÷ 5 = <b>13.500 W</b>.</div>
<h2 class="sec">4. Energia potencial: a energia da altura</h2>
<div class="fm">Epg = m · g · h<small>g = 10 m/s², h = altura em metros</small></div>
<p>Um tijolo no 10º andar tem mais energia guardada do que no chão: se cair, vai chegar com mais velocidade. Você <b>escolhe</b> onde a altura é zero (o nível de referência). Em geral, é o chão. Mudar a referência muda o valor da Epg, mas não a física do problema.</p>
<h2 class="sec">5. Conservação: a montanha-russa</h2>
<div class="fm">Ec + Epg = constante<small>sem atrito, a energia só troca de forma</small></div>
<div class="svgw"><svg viewBox="0 0 420 335" role="img" aria-label="Montanha-russa e barras de energia">
<path d="M20 40 C120 40 130 180 210 180 S330 80 400 80" stroke="#888" stroke-width="4" fill="none"/>
<circle cx="20" cy="40" r="9" fill="#2d5fa8"/><circle cx="122" cy="110" r="9" fill="#2d5fa8"/><circle cx="210" cy="180" r="9" fill="#2d5fa8"/>
<text x="35" y="30" style="font-weight:700">A</text><text x="135" y="100" style="font-weight:700">B</text><text x="218" y="205" style="font-weight:700">C</text>
<rect x="40" y="220" width="40" height="80" fill="#e08a1e"/>
<rect x="160" y="220" width="40" height="40" fill="#e08a1e"/><rect x="160" y="260" width="40" height="40" fill="#3b82c4"/>
<rect x="280" y="220" width="40" height="80" fill="#3b82c4"/>
<text x="60" y="214" text-anchor="middle">A: só Epg</text><text x="180" y="214" text-anchor="middle">B: metade/metade</text><text x="300" y="214" text-anchor="middle">C: só Ec</text>
<rect x="20" y="316" width="12" height="12" fill="#e08a1e"/><text x="38" y="327">Epg (altura)</text><rect x="140" y="316" width="12" height="12" fill="#3b82c4"/><text x="158" y="327">Ec (movimento)</text>
</svg></div>
<p class="cap">A altura das duas barras juntas é sempre a mesma. Se uma cresce, a outra diminui.</p>
<div class="ex"><b>Exemplo:</b> carrinho de 500 kg, a 20 m do solo. Energia total = 500 × 10 × 20 = 100.000 J. A 5 m: Epg = 500 × 10 × 5 = 25.000 J (25%). O resto, <b>75.000 J (75%)</b>, é Ec.<br>Atalho: se está a 5 de 20 metros, tem 5/20 = 25% de Epg.</div>`,
qui:`
<h2 class="sec">1. Primeiro, o vocabulário: café com açúcar</h2>
<p><b>Soluto</b> é o que se dissolve (açúcar). <b>Solvente</b> é o que dissolve (água). <b>Solução</b> é a mistura toda. A concentração diz o quanto de soluto tem na solução.</p>
<h2 class="sec">2. Concentração comum</h2>
<div class="fm">C = m ÷ V<small>C em g/L · m = massa do soluto em g · V = volume da solução em L</small></div>
<div class="svgw"><svg viewBox="0 0 200 150" style="max-width:240px;margin:auto" role="img" aria-label="Triângulo da fórmula C igual a m sobre V">
<polygon points="100,8 192,142 8,142" fill="none" stroke="#a8512d" stroke-width="3"/>
<line x1="52" y1="78" x2="148" y2="78" stroke="#a8512d" stroke-width="2"/><line x1="100" y1="78" x2="100" y2="142" stroke="#a8512d" stroke-width="2"/>
<text x="100" y="62" text-anchor="middle" style="font-size:24px;font-weight:700">m</text><text x="68" y="120" text-anchor="middle" style="font-size:24px;font-weight:700">C</text><text x="132" y="120" text-anchor="middle" style="font-size:24px;font-weight:700">V</text>
</svg></div>
<p class="cap">Triângulo mágico: tape o que você quer descobrir. Tapou C → m ÷ V. Tapou m → C × V. Tapou V → m ÷ C.</p>
<div class="warn"><b>Erro mais comum:</b> esquecer de converter mL para L. Divida por 1.000 antes de calcular. 250 mL = 0,25 L.</div>
<div class="ex"><b>Exemplo:</b> 30 g de sacarose em 250 mL. C = 30 ÷ 0,25 = <b>120 g/L</b>. Isso significa 120 g de açúcar em cada litro.</div>
<h2 class="sec">3. Concentração × densidade</h2>
<table><tr><th></th><th>Concentração</th><th>Densidade</th></tr>
<tr><td>Massa de...</td><td>só o <b>soluto</b></td><td>a <b>solução inteira</b></td></tr>
<tr><td>Dividida por...</td><td>volume da solução</td><td>volume da solução</td></tr></table>
<p>As unidades parecem (g/L ou g/mL), mas as grandezas são diferentes. É a pegadinha clássica.</p>
<h2 class="sec">4. Mol/L: contar em "pacotes"</h2>
<p>Em vez de contar em gramas, a química conta em <b>mols</b>, um "pacote" gigante de partículas, como uma dúzia, mas bem maior. A <b>massa molar (MM)</b> diz quanto pesa um pacote.</p>
<div class="fm">M = n ÷ V<small>mol/L = mols ÷ litros</small></div>
<div class="fm">n = m ÷ MM<small>mols = massa ÷ massa molar</small></div>
<div class="fm">C = M × MM<small>atalho: g/L = mol/L × g/mol</small></div>
<div class="box"><h3>Como achar a massa molar</h3>Some as massas atômicas de cada átomo da fórmula (tabela periódica). KOH = K (39) + O (16) + H (1) = <b>56 g/mol</b>.</div>
<div class="ex"><b>Exemplo:</b> KOH a 28 g/L. M = C ÷ MM = 28 ÷ 56 = <b>0,5 mol/L</b>. Massa em 200 mL (0,2 L): m = C × V = 28 × 0,2 = <b>5,6 g</b>.</div>
<h2 class="sec">5. Solubilidade</h2>
<p>É o quanto de uma substância dissolve em uma quantidade de água. Se você põe açúcar demais no café, ele deixa de dissolver e fica no fundo: você passou do <b>coeficiente de solubilidade</b>. "Insolúvel" na prática significa que dissolve <b>muito pouquinho</b>, não zero.</p>
<h2 class="sec">6. Funções inorgânicas: ache pela fórmula</h2>
<table><tr><th>Função</th><th>Como reconhecer</th><th>No dia a dia</th></tr>
<tr><td><b>Ácido</b></td><td>começa com <b>H</b> que se solta na água: HCl, H₂SO₄</td><td>bateria de carro, suco gástrico</td></tr>
<tr><td><b>Base</b></td><td>termina em <b>OH</b>: NaOH, KOH, Al(OH)₃</td><td>antiácidos, soda cáustica</td></tr>
<tr><td><b>Sal</b></td><td>vem da reação ácido + base: NaCl</td><td>sal de cozinha</td></tr>
<tr><td><b>Óxido</b></td><td><b>2 elementos</b>, um deles é O: SO₂, CO₂, CaO</td><td>queima de combustível, cal na construção</td></tr></table>
<div class="warn"><b>Pegadinha:</b> KOH tem OH, então é <b>base</b>, não sal.</div>`,
esp:`
<h2 class="sec">Módulo 11: Óxidos</h2>
<div class="box"><h3>O que é um óxido?</h3>Todo <b>composto binário</b> (só 2 elementos) que tem <b>oxigênio</b>, em que o oxigênio é o <b>mais eletronegativo</b> dos dois. Fórmula geral:<div class="fm" style="font-size:1.5rem">E<sub>x</sub>O<sub>y</sub></div>A água, <b>H₂O</b>, é um óxido.<br><small>Por que "mais eletronegativo"? O OF₂ não é óxido, porque o flúor é mais eletronegativo que o oxigênio.</small></div>
<h2 class="sec">Os 3 tipos: pergunte "com quem o oxigênio está ligado?"</h2>
<table><tr><th>Tipo</th><th>Formado por</th><th>Exemplos</th></tr>
<tr><td><b>Molecular</b> (covalente)</td><td>ametal + O</td><td>CO, CO₂, SO₃, Cl₂O, P₂O₅</td></tr>
<tr><td><b>Iônico</b> (metálico)</td><td>metal + O²⁻</td><td>Na₂O, CaO, Fe₂O₃</td></tr>
<tr><td><b>Peróxido</b></td><td>grupo <b>O₂²⁻</b> com grupo 1, grupo 2 ou H</td><td>H₂O₂, Na₂O₂, CaO₂</td></tr></table>
<div class="tip" style="margin-top:8px"><b>Roteiro rápido:</b> tem o grupo O₂ (dois oxigênios ligados, carga 2−)? É <b>peróxido</b>. Senão, o outro elemento é ametal? <b>Molecular</b>. É metal? <b>Iônico</b>.</div>
<h2 class="sec">1. Óxidos moleculares: nomes com prefixos</h2>
<div class="fm" style="font-size:1.15rem">prefixo + óxido de + prefixo + outro elemento<small>1º prefixo = nº de oxigênios · 2º prefixo = nº do outro elemento</small></div>
<table><tr><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>mono</td><td>di</td><td>tri</td><td>tetra</td><td>penta</td></tr></table>
<div class="warn"><b>Regra:</b> se o outro elemento tem só 1 átomo, <b>não</b> se escreve "mono" nele. CO₂ é "dióxido de carbono", e não "dióxido de monocarbono".</div>
<table><tr><th>Fórmula</th><th>Leitura</th><th>Nome</th></tr>
<tr><td>CO</td><td>1 O, 1 C</td><td>monóxido de carbono</td></tr>
<tr><td>CO₂</td><td>2 O, 1 C</td><td>dióxido de carbono</td></tr>
<tr><td>SO₃</td><td>3 O, 1 S</td><td>trióxido de enxofre</td></tr>
<tr><td>Cl₂O</td><td>1 O, 2 Cl</td><td>monóxido de dicloro</td></tr>
<tr><td>P₂O₅</td><td>5 O, 2 P</td><td>pentóxido de difósforo</td></tr></table>
<h2 class="sec">2. Óxidos iônicos: nome simples</h2>
<div class="fm" style="font-size:1.3rem">óxido de + nome do elemento</div>
<p>O metal doa elétrons e o oxigênio recebe (O²⁻). Para achar a fórmula, as cargas devem se <b>anular</b>: o número da carga de um vira o índice do outro.</p>
<table><tr><th>Íons</th><th>Fórmula</th><th>Nome</th></tr>
<tr><td>Na⁺ + O²⁻</td><td>Na₂O</td><td>óxido de sódio</td></tr>
<tr><td>Ca²⁺ + O²⁻</td><td>CaO</td><td>óxido de cálcio</td></tr>
<tr><td>Fe³⁺ + O²⁻</td><td>Fe₂O₃</td><td>óxido de ferro III</td></tr></table>
<div class="ex"><b>Ferro:</b> pode ter mais de uma carga (Fe²⁺ ou Fe³⁺). Por isso o algarismo romano mostra qual é. Fe³⁺ e O²⁻ cruzam: 2 ferros e 3 oxigênios, Fe₂O₃ (2 × 3+ = 6+ e 3 × 2− = 6−, tudo se anula).</div>
<h2 class="sec">3. Peróxidos: o oxigênio em dupla</h2>
<p>Aqui o oxigênio vem como um grupo <b>(O₂)²⁻</b>, dois oxigênios juntos com carga 2−. Aparece com elementos dos <b>grupos 1 e 2</b> e com o <b>H</b>.</p>
<div class="fm" style="font-size:1.3rem">peróxido de + nome do elemento</div>
<table><tr><th>Íons</th><th>Fórmula</th><th>Nome</th></tr>
<tr><td>H⁺ + O₂²⁻</td><td>H₂O₂</td><td>peróxido de hidrogênio (molecular)</td></tr>
<tr><td>Na⁺ + O₂²⁻</td><td>Na₂O₂</td><td>peróxido de sódio</td></tr>
<tr><td>Ca²⁺ + O₂²⁻</td><td>CaO₂</td><td>peróxido de cálcio</td></tr></table>
<div class="warn"><b>Não confunda:</b> Na₂O (óxido, 1 oxigênio) e Na₂O₂ (peróxido, grupo O₂). O índice do oxigênio muda o nome.</div>
<h2 class="sec">Indicadores ácido-base</h2>
<p>Indicador é uma substância que <b>muda de cor</b> conforme o pH do meio. É assim que se "vê" se algo é ácido ou básico.</p>
<div class="box"><h3>Suco de repolho roxo</h3>Muda por toda a escala de pH:</div>
<div class="svgw"><svg viewBox="0 0 420 110" role="img" aria-label="Cores do suco de repolho roxo por faixa de pH">
<rect x="0" y="22" width="70" height="40" fill="#d6303f"/><rect x="70" y="22" width="70" height="40" fill="#ee7fa6"/><rect x="140" y="22" width="70" height="40" fill="#8a56b8"/><rect x="210" y="22" width="70" height="40" fill="#4a6fd0"/><rect x="280" y="22" width="70" height="40" fill="#4aa86a"/><rect x="350" y="22" width="70" height="40" fill="#e8c933"/>
<text x="4" y="14" style="font-weight:700">mais ácido</text><text x="416" y="14" text-anchor="end" style="font-weight:700">mais básico</text>
<text x="35" y="80" text-anchor="middle">1 a 3</text><text x="105" y="80" text-anchor="middle">4 a 6</text><text x="175" y="80" text-anchor="middle">7 a 9</text><text x="245" y="80" text-anchor="middle">9 a 11</text><text x="315" y="80" text-anchor="middle">11 a 13</text><text x="385" y="80" text-anchor="middle">13 a 14</text>
<text x="35" y="98" text-anchor="middle">vermelho</text><text x="105" y="98" text-anchor="middle">rosa</text><text x="175" y="98" text-anchor="middle">roxo</text><text x="245" y="98" text-anchor="middle">azul</text><text x="315" y="98" text-anchor="middle">verde</text><text x="385" y="98" text-anchor="middle">amarelo</text>
</svg></div>
<p class="cap">Faixas conforme o roteiro da aula. Em outras fontes elas podem variar um pouco, então use as do seu caderno.</p>
<div class="box"><h3>Fenolftaleína</h3>Só tem dois "estados":<table><tr><td><b>Ácido</b></td><td>incolor</td></tr><tr><td><b>Básico</b></td><td>rosa, violeta ou vermelho</td></tr></table></div>
<div class="tip"><b>Dica:</b> o repolho dá uma cor para cada faixa de pH (mais informação). A fenolftaleína só responde "ácido ou básico?".</div>`
};
function resumo(){
  let h=DEFS+V[cur]+'<h2 class="sec">Resumo rápido para revisar</h2>'+S[cur].r.map(r=>`<div class="box"><h3>${r[0]}</h3><div>${r[1]}</div></div>`).join("");
  h+=`<div class="tip">Leu tudo? Vá para a aba <b>Quiz</b> e teste o que lembrou.</div>`;
  $("resumo").innerHTML=h;
}
function start(){qs=Q.filter(q=>q[0]===cur);i=0;score=0;done=false}
function quiz(){
  const el=$("quiz");
  if(i>=qs.length){
    const p=Math.round(score/qs.length*100);
    el.innerHTML=`<div class="box"><div class="meta">Resultado de ${S[cur].n}</div><div class="big">${score} de ${qs.length} (${p}%)</div><p>${p>=80?"Muito bem! Revise só o que errou.":p>=50?"Está no caminho. Releia o resumo e tente de novo.":"Volte ao resumo, leia com calma e refaça o quiz."}</p><button class="btn" id="re">Refazer quiz</button></div>`;
    $("re").onclick=()=>{start();quiz()};return;
  }
  const q=qs[i],L="ABCDE";
  el.innerHTML=`<div class="meta"><span>Questão ${i+1} de ${qs.length}</span><span>Acertos: ${score}</span></div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><p class="q">${q[1]}</p><div id="ops"></div><div id="fb"></div>`;
  q[2].forEach((t,j)=>{const b=document.createElement("button");b.className="opt";b.innerHTML=`<b>${L[j]})</b> ${t}`;
    b.onclick=()=>answer(j);$("ops").append(b)});
}
function answer(j){
  const q=qs[i],bs=[...document.querySelectorAll(".opt")];
  bs.forEach((b,k)=>{b.disabled=true;if(k===q[3])b.classList.add("ok");else if(k===j)b.classList.add("no")});
  if(j===q[3])score++;
  $("fb").innerHTML=`<div class="exp"><b>${j===q[3]?"Correto.":"Errado. A certa é a "+"ABCDE"[q[3]]+"."}</b> ${q[4]}</div><button class="btn" id="nx">${i+1<qs.length?"Próxima":"Ver resultado"}</button>`;
  $("nx").focus();$("nx").onclick=()=>{i++;quiz()};
}
function render(){
  setColor();nav();
  $("t1").setAttribute("aria-selected",tab===1);$("t2").setAttribute("aria-selected",tab===2);
  $("resumo").hidden=tab!==1;$("quiz").hidden=tab!==2;
  resumo();quiz();
}
$("t1").onclick=()=>{tab=1;render()};
$("t2").onclick=()=>{tab=2;render()};
start();render();
</script>
